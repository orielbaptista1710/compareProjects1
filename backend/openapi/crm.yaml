openapi: 3.0.3
info:
  title: CompareProjects CRM API
  version: 0.2.3
  description: >
    Draft contract (Phase 0), shared by the backend and the CRM frontend.
    Additive changes (new fields/endpoints) are free. Breaking changes (rename, remove, enum change)
    need both owners to agree before they ship.
    All endpoints live under /api/crm and authenticate with the CRM session cookie only. CRM staff
    accounts are separate from website accounts: no owner, agent, developer or website admin login
    works here.
    Every endpoint can return 429 RATE_LIMITED (login 10 per 15 minutes per IP; everything else
    120 per minute).
    Responses are automatically scoped to the caller's role; out-of-scope ids return 404.
    The crm_session cookie is HttpOnly, Secure and SameSite=Strict, so the app and API must be same-site.
    Send JSON bodies (Content-Type: application/json) with credentials included. The server rejects
    state-changing requests from any origin other than the allowed CRM app origins with 403 FORBIDDEN.
    Malformed JSON gets 400 VALIDATION_ERROR.
servers:
  - url: http://localhost:5000/api/crm
    description: Local backend
  - url: https://STAGING_API_HOST/api/crm
    description: Staging (replace host)

tags:
  - name: auth
  - name: leads
  - name: staff
  - name: zones

components:
  securitySchemes:
    crmSession:
      type: apiKey
      in: cookie
      name: crm_session
  schemas:
    CrmRole:
      type: string
      enum: [admin, crm_manager, zonal_manager, sales_rep]
    LeadStage:
      type: string
      enum: [new, contacted, qualified, site_visit, negotiation, handed_over, converted, lost]
    LeadCategory:
      type: string
      enum: [buyer, developer_partner]
    ListerType:
      type: string
      enum: [owner, agent, developer]
    Error:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, example: false }
        code:
          type: string
          description: Always set on 4xx errors. Unexpected server errors (5xx) send no code; show a generic "something went wrong".
          enum: [VALIDATION_ERROR, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED]
        message: { type: string }
    CrmUser:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: string, format: uuid, example: 9b2d7e41-0c3a-4f5e-8a1b-6d7c8e9f0a1b }
        email: { type: string, format: email, example: asha@company.example }
        name: { type: string, example: Asha Rao }
        role: { $ref: '#/components/schemas/CrmRole' }
    Enquiry:
      type: object
      required: [id, channel, source, createdAt]
      properties:
        id: { type: string, format: uuid }
        channel: { type: string, enum: [web, app, meta, whatsapp] }
        source: { type: string, example: quick_links_property_page_form }
        propertyId: { type: string, nullable: true, example: 65f0a1b2c3d4e5f607182930 }
        propertyTitle: { type: string, nullable: true, example: 3 BHK in Whitefield, description: 'Only set for approved listings.' }
        companyName: { type: string, nullable: true, example: Prestige Group, description: 'developer_partner enquiries only, as typed by the sender (unverified). null when contacts are masked (admin): it is free text and can contain contact details. Show "Hidden" when contactMasked is true.' }
        listerType: { allOf: [{ $ref: '#/components/schemas/ListerType' }], nullable: true }
        city: { type: string, nullable: true, example: Bengaluru }
        locality: { type: string, nullable: true, example: Whitefield }
        pincode: { type: string, nullable: true, example: '560066' }
        budget: { type: string, nullable: true, example: 1 to 1.5 Cr }
        message: { type: string, nullable: true, example: Is a weekend site visit possible?, description: 'Null when contactMasked (admin): free text often contains a phone or email.' }
        loanInterest: { type: boolean, nullable: true, example: true }
        createdAt: { type: string, format: date-time, example: '2026-11-16T08:15:00Z' }
    LeadSummary:
      type: object
      required: [id, name, stage, category, createdAt, contactMasked]
      properties:
        id: { type: string, format: uuid, example: 3f1c2a9e-5b7d-4c1a-9e0f-1a2b3c4d5e6f }
        name: { type: string, example: Priya Sharma }
        phone:
          type: string
          example: '+919876543210'
          description: Format +91XXXXXXXXXX. Masked (e.g. +91******3210) when contactMasked is true.
        email: { type: string, nullable: true, example: priya@example.com }
        contactMasked: { type: boolean, example: false }
        category: { $ref: '#/components/schemas/LeadCategory' }
        stage: { $ref: '#/components/schemas/LeadStage' }
        assignedTo: { type: string, format: uuid, nullable: true }
        assigneeName: { type: string, nullable: true, example: Asha Rao, description: 'Display name of assignedTo. Null when unassigned.' }
        zoneId: { type: string, format: uuid, nullable: true, description: 'null means the Unzoned queue.' }
        zoneName: { type: string, nullable: true, example: North Bengaluru, description: 'Display name of zoneId. Null when Unzoned.' }
        enquiryCount: { type: integer, example: 2 }
        lastActivityAt: { type: string, format: date-time, nullable: true, example: '2026-11-17T10:30:00Z' }
        createdAt: { type: string, format: date-time, example: '2026-11-16T08:15:00Z' }
    LeadDetail:
      allOf:
        - $ref: '#/components/schemas/LeadSummary'
        - type: object
          properties:
            lostReason: { type: string, nullable: true }
            enquiries:
              type: array
              description: Newest first, at most 100 (enquiryCount has the full total).
              items: { $ref: '#/components/schemas/Enquiry' }
    LeadList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/LeadSummary' }
        nextCursor:
          type: string
          nullable: true
          description: Pass back as `cursor` for the next page. Null on the last page.
  responses:
    BadRequest:
      description: VALIDATION_ERROR. A query parameter or body field is invalid, or the body has a field the endpoint doesn't accept.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthenticated:
      description: No valid session.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Role is not allowed to do this.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found, or outside the caller's scope (the API never says which).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Staff login. Sets the HttpOnly crm_session cookie.
      description: >
        Rate limited per IP. After 5 wrong passwords the account is locked for 15 minutes. While locked,
        every attempt (even with the right password) gets the same 401 as a wrong password, so the
        response never reveals whether an email belongs to a staff account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, maxLength: 128 }
                mfaCode: { type: string, pattern: '^[0-9]{6}$', description: 'Reserved for Phase 2 (MFA). Ignored for now.' }
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  user: { $ref: '#/components/schemas/CrmUser' }
        '400':
          description: Email or password missing or malformed.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429':
          description: Too many attempts.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session and clear the cookie.
      security: [{ crmSession: [] }]
      responses:
        '204': { description: Logged out. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/me:
    get:
      tags: [auth]
      summary: Current staff member (call on app load).
      security: [{ crmSession: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/CrmUser' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /leads:
    get:
      tags: [leads]
      summary: Lead inbox, scoped to the caller's role.
      description: >
        crm_manager sees all, zonal_manager sees own zones, sales_rep sees only leads assigned to self.
        admin sees masked contact details. Cursor pagination, newest first.
      security: [{ crmSession: [] }]
      parameters:
        - { name: stage, in: query, schema: { $ref: '#/components/schemas/LeadStage' } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/LeadCategory' } }
        - { name: zoneId, in: query, schema: { type: string, format: uuid } }
        - { name: assignedTo, in: query, schema: { type: string, format: uuid } }
        - { name: unassigned, in: query, schema: { type: boolean } }
        - { name: q, in: query, description: 'Name or phone search. For roles that see masked contacts (admin) it matches the name only, so a masked number cannot be recovered by searching.', schema: { type: string, maxLength: 50 } }
        - { name: cursor, in: query, description: 'Opaque string: pass back exactly the nextCursor you received. Never build or parse it.', schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 25 } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/LeadList' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /leads/{leadId}:
    parameters:
      - { name: leadId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [leads]
      summary: Lead detail with its newest enquiries (at most 100).
      security: [{ crmSession: [] }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/LeadDetail' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [leads]
      summary: Change stage (and lost reason) and/or correct the category. Writes an activity.
      description: >
        Send at least one of stage or category. Category is self-declared by the website form
        (anyone can open the developer popup), so staff correct it after calling the person.
        crm_manager (all leads), zonal_manager (own zones) and sales_rep (own assigned leads) may call it;
        admin gets 403. Sending stage lost again with a new lostReason updates the reason.
        Moving a lead out of lost clears its reason. Sending the current values changes nothing.
      security: [{ crmSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf: [{ required: [stage] }, { required: [category] }]
              additionalProperties: false
              properties:
                stage: { $ref: '#/components/schemas/LeadStage' }
                lostReason: { type: string, nullable: true, minLength: 1, maxLength: 300, description: 'Required when stage is lost, and only sent then (otherwise omit it or send null). Stored as plain text: HTML tags are removed.' }
                category: { $ref: '#/components/schemas/LeadCategory' }
      responses:
        '200':
          description: Updated.
          content: { application/json: { schema: { $ref: '#/components/schemas/LeadDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /leads/{leadId}/reveal:
    post:
      tags: [leads]
      summary: Admin only. Return the unmasked phone and email. Every call is written to the audit log.
      security: [{ crmSession: [] }]
      parameters:
        - { name: leadId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Unmasked contact details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  phone: { type: string, example: '+919876543210' }
                  email: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /staff:
    get:
      tags: [staff]
      summary: Staff the caller may assign leads to (for the assign picker). crm_manager and zonal_manager only.
      description: crm_manager gets all reps; zonal_manager gets reps in their own zones.
      security: [{ crmSession: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, role]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        role: { $ref: '#/components/schemas/CrmRole' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /zones:
    get:
      tags: [zones]
      summary: Zones the caller may see (for the zone filter). Scoped by role.
      description: admin and crm_manager get all zones; zonal_manager the zones they manage; sales_rep the zones they belong to.
      security: [{ crmSession: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string, example: North Bengaluru }
                        city: { type: string, example: Bengaluru }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /leads/{leadId}/assign:
    post:
      tags: [leads]
      summary: Assign or reassign. crm_manager (any rep) and zonal_manager (reps in own zones) only.
      security: [{ crmSession: [] }]
      parameters:
        - { name: leadId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeId]
              additionalProperties: false
              properties:
                assigneeId: { type: string, format: uuid, description: 'An id from GET /staff (an active sales_rep the caller may assign to).' }
      responses:
        '200':
          description: Assigned. Assigning to the current assignee changes nothing.
          content: { application/json: { schema: { $ref: '#/components/schemas/LeadDetail' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Lead not found or out of scope, or the assignee is not someone the caller may assign to.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
